[pytest]
# CI runs bare `pytest`, which — unlike `python -m pytest` — does NOT put the
# current directory on sys.path. tests/test_generate.py imports `src` at
# module level and would then die during collection with
# "ModuleNotFoundError: No module named 'src'". Declaring the root explicitly
# makes the import work the same way from CI, a venv, or an IDE runner.
pythonpath = .
testpaths = tests
